name: 小黑盒每日签到

on:
  schedule:
    # UTC 时间：01:30 = 北京时间 09:30
    # GitHub cron 可能延迟数分钟，且仓库 60 天无活动会自动停用定时任务
    - cron: '30 1 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run 小黑盒签到
        env:
          heybox_ck: ${{ secrets.HEYBOX_CK }}
        run: node heybox_sign.js

      - name: Run 0元抽奖盒券
        # 抽奖活动常含 Steam 拥有游戏 / 好友助力 / 购买 DLC 等脚本做不了的前置任务，
        # 只要有活动未完成 roll 就会返回 1。签到才是核心，这里不阻断整条工作流。
        continue-on-error: true
        env:
          heybox_ck: ${{ secrets.HEYBOX_CK }}
        run: node heybox_roll.js
